name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build + test ${{ matrix.tz }}
    runs-on: macos-15
    # Date filters and ISO offsets depend on the local zone; run a non-UTC leg too.
    strategy:
      fail-fast: false
      matrix:
        tz: [UTC, America/Los_Angeles]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        run: swift build -c release
        working-directory: swift

      - name: Make fixture store
        id: fixture
        run: |
          DB=$(tests/make-fixture.sh "$RUNNER_TEMP/fixture")
          echo "db=$DB" >> "$GITHUB_OUTPUT"

      - name: Run test suite
        env:
          JOURNAL_SEED: ${{ steps.fixture.outputs.db }}
          JOURNAL_CLI: ${{ github.workspace }}/swift/.build/release/journal-cli
        run: tests/test_read.sh
